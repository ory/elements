name: Release

on:
  push:
    branches: [main]
    paths: ["packages/*/package.json"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Perform a dry run without publishing to npm"
        required: true
        type: boolean
        default: true
      prerelease:
        description: |
          Prerelease identifier (e.g. rc). Versions the pending changesets as
          X.Y.Z-<id>.N in the runner and publishes them to the next dist-tag.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Find release commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commits: ${{ steps.commits.outputs.commits }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        if: ${{ github.event_name == 'push' }}
        with:
          node-version: "24"
      - uses: ./.github/actions/setup-pnpm
        if: ${{ github.event_name == 'push' }}
        with:
          cache: restore

      - name: Install dependencies
        if: ${{ github.event_name == 'push' }}
        run: pnpm install --frozen-lockfile

      - name: Find release commits
        id: commits
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            commits="$(node scripts/changesets/release-commits.ts)"
          else
            commits="$(jq -cn --arg sha "$(git rev-parse HEAD)" '[$sha]')"
          fi
          echo "commits=${commits}" >> "${GITHUB_OUTPUT}"
          echo "Release commits: ${commits}"

  release:
    name: Build & publish ${{ matrix.commit }}
    needs: plan
    if: ${{ needs.plan.outputs.commits != '[]' }}
    strategy:
      max-parallel: 1
      matrix:
        commit: ${{ fromJSON(needs.plan.outputs.commits) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write # Required for OIDC
      contents: write # GitHub releases and their tags
    env:
      DRY_RUN:
        ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false
        }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.commit }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # The checkout above can hold another commit, so `$/` loads the action from the workflow commit instead.
      - uses: $/.github/actions/setup-pnpm
        with:
          cache: save

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Plan release
        run: |
          set -euo pipefail
          args=(--out "${RUNNER_TEMP}/release-plan.json")
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if ! [[ "${PRERELEASE}" =~ ^[a-z]+$ ]]; then
              echo "::error::Prerelease identifier must be lowercase letters, got '${PRERELEASE}'."
              exit 1
            fi
            args+=(--prerelease "${PRERELEASE}")
          fi
          node scripts/changesets/prepare-release.ts "${args[@]}"

      - name: Build
        run: |
          set -euo pipefail
          projects="$(jq -r 'map(select(.alreadyPublished | not) | .name) | join(",")' "${RUNNER_TEMP}/release-plan.json")"
          if [ -n "${projects}" ]; then
            pnpm exec nx run-many -t build --projects="${projects}"
          fi

      - name: Publish
        run: |
          set -euo pipefail
          mapfile -t releases < <(jq -c '.[]' "${RUNNER_TEMP}/release-plan.json")
          for release in "${releases[@]}"; do
            name="$(jq -r .name <<<"${release}")"
            dir="$(jq -r .dir <<<"${release}")"
            version="$(jq -r .version <<<"${release}")"
            dist_tag="$(jq -r .distTag <<<"${release}")"

            if [[ "${version}" == *-* && "${dist_tag}" == "latest" ]]; then
              echo "::error::Refusing to publish prerelease ${name}@${version} to latest."
              exit 1
            fi

            if [ "$(jq -r .alreadyPublished <<<"${release}")" = "true" ]; then
              echo "${name}@${version} is already on npm, skipping publish."
            else
              # npm rejects provenance unless repository.url names the publishing repository.
              jq --arg url "git+https://github.com/${GITHUB_REPOSITORY}.git" --arg dir "${dir}" \
                '.repository = {type: "git", url: $url, directory: $dir}' \
                "${dir}/package.json" > "${RUNNER_TEMP}/package.json"
              mv "${RUNNER_TEMP}/package.json" "${dir}/package.json"
              (cd "${dir}" && pnpm publish --tag "${dist_tag}" --provenance --access public --dry-run="${DRY_RUN}" --no-git-checks)
            fi
          done

      - name: Create GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          mapfile -t releases < <(jq -c '.[]' "${RUNNER_TEMP}/release-plan.json")
          for release in "${releases[@]}"; do
            name="$(jq -r .name <<<"${release}")"
            version="$(jq -r .version <<<"${release}")"
            git_tag="$(jq -r .gitTag <<<"${release}")"

            if [ "${DRY_RUN}" = "true" ]; then
              echo "Dry run: would create ${git_tag} at ${commit}."
              continue
            fi

            if ! gh release view "${git_tag}" >/dev/null 2>&1; then
              prerelease_flag=()
              if [[ "${version}" == *-* ]]; then
                prerelease_flag=(--prerelease)
              fi
              jq -r .notes <<<"${release}" > "${RUNNER_TEMP}/notes.md"
              gh release create "${git_tag}" --target "${commit}" \
                --title "${name} v${version}" \
                --notes-file "${RUNNER_TEMP}/notes.md" \
                "${prerelease_flag[@]}"
            fi
          done
